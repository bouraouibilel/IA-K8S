replicaCount: 3

# Active le mode distribué (p2p inter-noeuds, port 6335)
qdrant:
  config:
    cluster:
      enabled: true
      p2p:
        port: 6335

podDisruptionBudget:
  enabled: true
  minAvailable: 2
  maxUnavailable: null


affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: "kubernetes.io/hostname"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant

resources:
  requests: { cpu: "2", memory: "4Gi" }
  limits:   { cpu: "4", memory: "8Gi" }

persistence:
  enabled: true

service:
  type: ClusterIP
  ports:
    http:
      name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
      checksEnabled: true
    grpc:
      name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
      checksEnabled: false
    p2p:
      name: p2p
      port: 6335
      targetPort: 6335
      protocol: TCP
      checksEnabled: false

env:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom: { secretKeyRef: { name: qdrant-secrets, key: api-key } }

serviceMonitor:
  enabled: true
