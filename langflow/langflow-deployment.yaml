apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow
  template:
    metadata:
      labels:
        app: langflow
    spec:
      containers:
        - name: langflow
          image: langflowai/langflow:latest
          ports:
            - containerPort: 7860
          env:
            - name: LANGFLOW_PORT
              value: "7860"
            - name: LANGFLOW_HOST
              value: "0.0.0.0"

            # Qdrant (namespace qdrant)
            - name: QDRANT_HOST
              value: "qdrant.qdrant.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"

            # AnythingLLM (namespace anythingllm)
            - name: ANYTHINGLLM_HOST
              value: "anythingllm.anythingllm.svc.cluster.local"
            - name: ANYTHINGLLM_PORT
              value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-service
  namespace: langflow
spec:
  selector:
    app: langflow
  ports:
    - protocol: TCP
      port: 80
      targetPort: 7860
  type: ClusterIP
